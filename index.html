<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- REQUIRED VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Explorer</title>

  <!-- Styles -->
  <link rel="stylesheet" href="index.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
</head>
<body>

<header>
  <h1>🎵 Music Explorer</h1>
  <p>Learn instruments through sound and visuals</p>

  <!-- INSTALL BUTTON -->
  <button id="installBtn" hidden>Install App</button>
</header>

<div class="top-bar">
  <input type="text" id="search" placeholder="Search instruments...">

  <select id="filter">
    <option value="all">All Categories</option>
    <option value="String">String</option>
    <option value="Percussion">Percussion</option>
    <option value="Keyboard">Keyboard</option>
    <option value="Wind">Wind</option>
  </select>
</div>

<div class="container">
  <aside>
    <ul id="menu"></ul>
  </aside>

  <main>
    <h2 id="title">Select an instrument</h2>
    <img id="image" src="" alt="">
    <p id="description"></p>

    <div class="controls">
      <button id="playBtn">▶ Play</button>
      <button id="stopBtn">⏹ Stop</button>
    </div>
  </main>
</div>

<footer>
  <p>Music Explorer PWA</p>
</footer>

<script src="index.js"></script>
</body>
</html>
